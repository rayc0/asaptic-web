<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Not Found · Asaptic</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="This Asaptic URL does not exist." />
  <!-- Styles are INLINE on purpose: the 404 page must render correctly even when
       the miss that produced it is itself a broken asset path. No external CSS,
       no external fonts, no JS. -->
  <style>
    :root{
      --bg:#0A1428; --bg-darker:#080F1E; --white:#FFFFFF;
      --accent:#29B6F6; --gray:#B0BEC5; --gray-dim:#4A5568; --border:#1A385C;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh; min-width:320px;
      display:flex; align-items:center; justify-content:center;
      background:
        linear-gradient(180deg, rgba(10,20,40,.96), rgba(8,15,30,1) 42%),
        radial-gradient(circle at 72% 8%, rgba(41,182,246,.16), transparent 34%),
        var(--bg);
      color:var(--white);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      line-height:1.6; -webkit-font-smoothing:antialiased;
      padding:32px;
    }
    .dossier{
      width:min(560px,100%);
      background:rgba(15,30,56,.55);
      border:1px solid var(--border);
      border-radius:2px;
      padding:40px 36px 34px;
    }
    .stamp{
      font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:11px; letter-spacing:.22em; text-transform:uppercase;
      color:var(--accent); margin-bottom:22px;
    }
    .code{
      font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:56px; font-weight:700; line-height:1; letter-spacing:-.02em;
      margin-bottom:6px;
    }
    .rule{height:1px;background:var(--border);margin:22px 0}
    .line{color:var(--gray);font-size:15px;margin-bottom:6px}
    .line.zh{color:var(--gray);font-size:15px}
    .path{
      font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:12px; color:var(--gray-dim); word-break:break-all; margin-top:18px;
    }
    .home{
      display:inline-block; margin-top:26px;
      font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:12px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--accent); text-decoration:none;
      border:1px solid var(--accent); border-radius:2px;
      padding:11px 20px;
    }
    .home:hover{background:var(--accent);color:var(--bg-darker)}
    .home:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .alt{margin-top:20px;font-size:12px;color:var(--gray-dim)}
    .alt a{color:var(--gray);text-decoration:none;border-bottom:1px solid var(--border)}
    .alt a:hover{color:var(--accent)}
    @media (max-width:480px){ .dossier{padding:30px 22px 26px} .code{font-size:44px} }
  </style>
</head>
<body>
  <main class="dossier">
    <div class="stamp">Asaptic · Record Not Found</div>
    <div class="code">404</div>
    <div class="rule"></div>
    <p class="line">This page does not exist on asaptic.com.</p>
    <p class="line zh">此页面不存在于 asaptic.com。</p>
    <p class="path" id="p"></p>
    <a class="home" href="/">Return home · 返回首页</a>
    <p class="alt">
      Looking for live tenders? <a href="/tender/">asaptic.com/tender</a> ·
      Contact <a href="mailto:engage@asaptic.com">engage@asaptic.com</a>
    </p>
  </main>
  <script>
    // Purely cosmetic: echo the requested path back. No navigation, no fetch.
    try { document.getElementById('p').textContent = location.pathname; } catch (e) {}
  </script>
</body>
</html>
