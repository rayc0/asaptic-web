name: Brand Firewall Sweep

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  firewall:
    name: Scan for forbidden tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make sweep scripts executable
        run: chmod +x .github/scripts/firewall_sweep.sh .github/scripts/gating_sweep.sh

      - name: Run firewall sweep (brand-string leakage)
        run: bash .github/scripts/firewall_sweep.sh .

      # Brand-string leakage alone doesn't catch an internal-audience page
      # (workbench/ops/dashboard tool) shipping ungated in the public
      # deploy output — added 2026-07-14 after the workbench false-alarm
      # showed the firewall had no gating check at all.
      - name: Run gating sweep (ungated internal-audience pages)
        run: bash .github/scripts/gating_sweep.sh .
